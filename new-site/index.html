<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#173f35">
  <meta name="description" content="할 일과 일정을 한눈에 보고 날짜별 다이어리를 기록하는 브라우저 저장형 데일리 플래너">
  <title>하루선 — 일정과 다이어리</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main-content">본문으로 건너뛰기</a>

  <header class="app-header">
    <a class="brand" href="./" aria-label="하루선 홈">
      <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true">
        <path d="M7 9.5h26M7 20h26M7 30.5h26"></path>
        <circle cx="14" cy="9.5" r="3"></circle>
        <circle cx="26" cy="20" r="3"></circle>
        <circle cx="18" cy="30.5" r="3"></circle>
      </svg>
      <span>
        <strong>하루선</strong>
        <small>일정과 기록이 만나는 하루</small>
      </span>
    </a>

    <div class="header-actions">
      <span class="storage-state" id="storage-state">
        <span class="storage-dot" aria-hidden="true"></span>
        이 브라우저에 저장
      </span>
      <button class="button button-quiet" id="today-button" type="button">오늘로</button>
      <button class="button button-primary" id="open-task-editor" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
        할 일 추가
      </button>
    </div>
  </header>

  <main class="app-shell" id="main-content">
    <aside class="date-rail" aria-labelledby="date-rail-title">
      <div class="date-rail-heading">
        <div>
          <h1 id="date-rail-title">이번 주</h1>
          <p id="month-label"></p>
        </div>
        <div class="week-controls" aria-label="주 이동">
          <button class="icon-button" id="previous-week" type="button" aria-label="이전 주">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
          </button>
          <button class="icon-button" id="next-week" type="button" aria-label="다음 주">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
          </button>
        </div>
      </div>
      <div class="week-list" id="week-list" aria-label="날짜 선택"></div>
      <p class="privacy-note">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10V8a5 5 0 0 1 10 0v2M6 10h12v10H6z"></path></svg>
        일정과 다이어리는 현재 브라우저에만 저장됩니다.
      </p>
    </aside>

    <section class="task-workspace" aria-labelledby="task-heading">
      <header class="day-heading">
        <div>
          <p class="full-date" id="full-date"></p>
          <h2 id="task-heading">오늘의 흐름</h2>
        </div>
        <div class="day-summary" aria-label="일정 요약">
          <span><strong id="remaining-count">0</strong> 남음</span>
          <span><strong id="week-count">0</strong> 이번 주</span>
          <span><strong id="completion-rate">0%</strong> 완료</span>
        </div>
      </header>

      <section class="task-editor" id="task-editor" aria-labelledby="editor-title" hidden>
        <div class="editor-heading">
          <h3 id="editor-title">할 일 추가</h3>
          <button class="icon-button" id="close-task-editor" type="button" aria-label="할 일 편집 닫기">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
          </button>
        </div>
        <form id="task-form">
          <input id="task-id" type="hidden">
          <div class="field field-wide">
            <label for="task-title">할 일</label>
            <input id="task-title" name="title" type="text" maxlength="80" placeholder="무엇을 완료해야 하나요?" required>
          </div>
          <div class="field">
            <label for="task-date">날짜</label>
            <input id="task-date" name="date" type="date" required>
          </div>
          <div class="field">
            <label for="task-time">시간</label>
            <input id="task-time" name="time" type="time">
          </div>
          <div class="field">
            <label for="task-priority">중요도</label>
            <select id="task-priority" name="priority">
              <option value="normal">보통</option>
              <option value="high">중요</option>
              <option value="low">여유</option>
            </select>
          </div>
          <div class="field field-wide">
            <label for="task-notes">메모 <span>선택</span></label>
            <textarea id="task-notes" name="notes" rows="2" maxlength="240" placeholder="준비물이나 세부 내용을 적어두세요."></textarea>
          </div>
          <div class="editor-actions field-wide">
            <button class="button button-quiet" id="cancel-task" type="button">취소</button>
            <button class="button button-primary" type="submit">일정 저장</button>
          </div>
        </form>
      </section>

      <div class="task-toolbar">
        <div class="filter-group" aria-label="할 일 보기 방식">
          <button class="filter-button is-active" type="button" data-filter="day" aria-pressed="true">선택한 날</button>
          <button class="filter-button" type="button" data-filter="open" aria-pressed="false">남은 할 일</button>
          <button class="filter-button" type="button" data-filter="completed" aria-pressed="false">완료</button>
        </div>
        <label class="search-field" for="task-search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
          <span class="sr-only">할 일 검색</span>
          <input id="task-search" type="search" placeholder="할 일 검색">
        </label>
      </div>

      <div class="task-list" id="task-list" aria-live="polite"></div>
    </section>

    <aside class="diary-panel" aria-labelledby="diary-heading">
      <header class="diary-heading">
        <div>
          <p id="diary-date-label"></p>
          <h2 id="diary-heading">하루 기록</h2>
        </div>
        <span class="save-state" id="diary-save-state" role="status">작성 전</span>
      </header>

      <div class="diary-prompt" id="diary-prompt">오늘의 마음과 기억하고 싶은 장면을 남겨보세요.</div>

      <div class="field diary-title-field">
        <label for="diary-title">제목</label>
        <input id="diary-title" type="text" maxlength="60" placeholder="오늘을 한 문장으로">
      </div>
      <div class="field diary-body-field">
        <label for="diary-body">내용</label>
        <textarea id="diary-body" rows="15" maxlength="5000" placeholder="천천히 적어도 괜찮아요. 이 기록은 현재 브라우저 밖으로 전송되지 않습니다."></textarea>
      </div>
      <div class="diary-footer">
        <span id="diary-count">0자</span>
        <div>
          <button class="button button-danger-quiet" id="delete-diary" type="button" disabled>기록 지우기</button>
          <button class="button button-primary" id="save-diary" type="button">기록 저장</button>
        </div>
      </div>
    </aside>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true" hidden>
    <span id="toast-message"></span>
    <button id="toast-action" type="button" hidden>실행 취소</button>
  </div>
</body>
</html>
